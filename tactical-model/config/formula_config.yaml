# Настройки физически читаемой модели попадания для Tactical Shot Lab.
# Файл перечитывается во время работы: сохрани YAML и нажми Fire или Simulate 100.
#
# Идея модели:
# - стрелок и оружие дают угловую ошибку в milliradian (mrad);
# - дистанция превращает угловую ошибку в разброс в метрах;
# - цель имеет радиус попадания в метрах;
# - шанс попадания считается из соотношения радиуса цели и ожидаемого разброса.

default_target: human # Какую цель выбрать при запуске, если UI еще ничего не выбрал.

targets:
  small_target:
    name: Маленькая цель # Маленькая цель: голова, тарелка, узкий силуэт за укрытием.
    hit_radius_m: 0.15 # Эффективный радиус попадания в метрах. Меньше радиус - сложнее попасть.
  human:
    name: Человек # Условный человеческий силуэт без разделения на части тела.
    hit_radius_m: 0.25
  large_creature:
    name: Крупная цель # Крупная цель вроде большого зверя, робота или широкой техники.
    hit_radius_m: 0.75
  elephant:
    name: Размером со слона # Очень крупная цель: на большой дистанции все еще имеет большой угловой размер.
    hit_radius_m: 1.50

shooter:
  min_aim_error_mrad: 1.2 # Угловая ошибка элитного стрелка при спокойном одиночном выстреле.
  max_aim_error_mrad: 16.0 # Угловая ошибка стрелка с минимальным профессиональным навыком.
  skill_curve_power: 0.65 # Кривая навыка: меньше 1 делает средний навык ближе к профессиональному уровню.
  aim_error_reduction_per_ap: 0.025 # Насколько каждый AP прицеливания снижает ошибку стрелка.
  aim_error_reduction_skill_scaling: 0.50 # Насколько навык усиливает снижение ошибки от AP прицеливания.
  movement_tracking_compensation: 0.75 # Доля штрафа движения, которую может компенсировать навык 100.

default_weapon: basic_pistol # Какое оружие выбрать при запуске, если UI еще ничего не выбрал.

weapons:
  basic_pistol:
    name: Базовый пистолет # Название оружия, которое показывается в интерфейсе и логе.
    mechanical_accuracy_mrad: 5.5 # Собственная кучность оружия: чем меньше, тем точнее ствол/патрон.
    handling: 0.80 # Насколько оружие удобно быстро навести и удерживать: 1.0 почти не добавляет ошибки, 0.0 добавляет максимум.
    handling_error_max_mrad: 10.0 # Максимальная угловая ошибка наведения/удержания при handling = 0.
    aim_handling_gain_per_ap: 0.015 # Насколько каждый AP прицеливания повышает handling до учета навыка.
    aim_skill_scaling: 0.30 # Насколько навык стрелка усиливает пользу AP прицеливания.
    sight_alignment_error_mrad: 4.5 # Угловая ошибка совмещения прицельных приспособлений; не растет с дистанцией сама по себе.
  service_revolver:
    name: Служебный револьвер # Мощный короткоствольный револьвер: хуже прицелы и дальность, нормальная механика.
    mechanical_accuracy_mrad: 6.5
    handling: 0.72
    handling_error_max_mrad: 11.0
    aim_handling_gain_per_ap: 0.018
    aim_skill_scaling: 0.30
    sight_alignment_error_mrad: 4.8
  compact_smg:
    name: Компактный ПП # Короткий ПП: быстро наводится, но одиночный точный выстрел хуже карабина.
    mechanical_accuracy_mrad: 6.0
    handling: 0.86
    handling_error_max_mrad: 8.0
    aim_handling_gain_per_ap: 0.012
    aim_skill_scaling: 0.25
    sight_alignment_error_mrad: 3.8
  carbine:
    name: Карабин # Легкая винтовка/карабин: точнее и дальнобойнее пистолета, но менее верткая.
    mechanical_accuracy_mrad: 1.2
    handling: 0.48
    handling_error_max_mrad: 8.0
    aim_handling_gain_per_ap: 0.020
    aim_skill_scaling: 0.60
    sight_alignment_error_mrad: 0.6

movement:
  tracking_error_mrad_per_mps: 6.0 # Угловая ошибка сопровождения за каждый м/с скорости цели.
  speeds_mps:
    Standing: 0.0 # Неподвижная цель.
    Walking: 1.4 # Примерная скорость шага в м/с.
    Running: 3.5 # Примерная скорость бега в м/с.
    Sprinting: 5.5 # Примерная скорость спринта в м/с.
  direction_modifiers:
    Toward shooter: 0.35 # Цель идет на стрелка: угловое смещение небольшое.
    Away from shooter: 0.50 # Цель уходит от стрелка: угловое смещение все еще умеренное.
    Sideways: 1.00 # Цель движется поперек линии огня: нужно сопровождение и упреждение.
    Zigzag: 1.45 # Цель меняет направление: сопровождение сложнее всего.

random:
  minimum_hit_chance: 1.0 # Нижняя граница шанса, чтобы симуляция не становилась абсолютно детерминированной.
  maximum_hit_chance: 99.0 # Верхняя граница шанса, чтобы почти идеальный выстрел все еще мог сорваться.
  blocked_line_hit_chance: 0.0 # Шанс попадания, если линия огня перекрыта препятствием.
